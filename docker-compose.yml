services:
    bot:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: hina
        env_file:
            - .env
        restart: unless-stopped
        volumes:
            - ./prisma:/app/prisma
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:18.2
        container_name: postgres
        env_file:
            - .env
        volumes:
            - postgres-data:/var/lib/postgresql
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres-data:

